<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Front Page</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

<button id="add-person-btn" data-action="create">Add new person to database</button>

<table>
    <thead>
        <tr>
            <th>First name</th>
            <th>Last name</th>
            <th>Age</th>
            <th>Birthday</th>
            <th>Gender</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody class="person-list">

    </tbody>
</table>

<div class="popup-container hidden">
    <form class="popup-form" data-action="create">
        <h3 id="h3-form">Add person to the database</h3>
        <p class="activity-text hidden"></p>
        <div>
            <label for="first-name">First name:</label>
            <input required type="text" id="first-name" name="first-name">
        </div>
        <div>
            <label for="last-name">Last name:</label>
            <input required type="text" id="last-name" name="last-name">
        </div>
        <div>
            <label for="date">Birthday:</label>
            <input required type="date" id="date" name="date">
        </div>
        <div>
            <label for="gender">Gender:</label>
            <select required name="gender" id="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Confused">Other</option>
            </select>
        </div>
        <div id="registration-number-box">
            <label for="registration-number">Registration number:</label>
            <input required type="text" id="registration-number" name="registration-number" placeholder="Between 6 and 8 digits">
        </div>
        <button type="submit" id="submit-btn">Submit</button>
    </form>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
