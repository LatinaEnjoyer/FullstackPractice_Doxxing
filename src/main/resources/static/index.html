<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Front Page</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

<button id="add-person-btn">Add new person to database</button>

<table>
    <thead>
        <tr>
            <th>First name</th>
            <th>Last name</th>
            <th>Age</th>
            <th>Birthday</th>
            <th>Gender</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody class="person-list">

    </tbody>
</table>

<div class="popup-container hidden">
    <form class="popup-add-form">
        <p class="activity-text hidden"></p>
        <label for="first-name">First name:</label>
        <input required type="text" id="first-name" name="first-name">
        <label for="last-name">Last name:</label>
        <input required type="text" id="last-name" name="last-name">
        <label for="date">Birthday:</label>
        <input required type="date" id="date" name="date">
        <label for="gender">Gender:</label>
        <select required name="gender" id="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Confused">Other</option>
        </select>
        <label for="registration-number">Registration number:</label>
        <input required type="text" id="registration-number" name="registration-number" placeholder="Between 6 and 8 digits">
        <button type="submit">Add new person to database</button>
    </form>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
